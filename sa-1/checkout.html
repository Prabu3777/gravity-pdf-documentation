<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ellakai Spices</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .checkout-page { padding: 120px 0 80px; min-height: 100vh; background: #F8F5F0; }
        .checkout-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .checkout-steps { display: flex; justify-content: center; gap: 30px; margin-bottom: 50px; }
        .step { display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: white; border-radius: 8px; font-weight: 600; }
        .step.active { background: #C46A2D; color: white; }
        .step-number { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .checkout-content { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; }
        .checkout-form { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); }
        .section-title { font-size: 24px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #F8F5F0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #1B3A2B; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #E5E5E5; border-radius: 8px; font-family: 'Inter', sans-serif; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #C46A2D; }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .payment-methods { display: grid; gap: 15px; margin: 20px 0; }
        .payment-option { padding: 20px; border: 2px solid #E5E5E5; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 15px; }
        .payment-option:hover, .payment-option.selected { border-color: #C46A2D; background: #FFF8F3; }
        .payment-option input { margin: 0; }
        .payment-icon { width: 50px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .order-summary { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); height: fit-content; position: sticky; top: 100px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #F8F5F0; }
        .summary-total { font-size: 22px; font-weight: 700; color: #1B3A2B; margin-top: 20px; padding-top: 20px; border-top: 2px solid #E5E5E5; }
        .place-order-btn { width: 100%; padding: 18px; background: #1B3A2B; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .place-order-btn:hover { background: #152E21; }
        @media (max-width: 968px) { .checkout-content { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } .checkout-steps { flex-direction: column; align-items: stretch; } }
    </style>
</head>
<body>
    <header class="header scrolled" id="header">
        <nav class="navbar">
            <div class="container">
                <div class="nav-wrapper">
                    <div class="logo"><a href="index.html"><i class="fas fa-seedling"></i><span>Ellakai Spices</span></a></div>
                    <ul class="nav-menu" id="navMenu">
                        <li><a href="index.html" class="nav-link">Home</a></li>
                        <li><a href="cart.html" class="nav-link">Cart</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="checkout-page">
        <div class="checkout-container">
            <div class="checkout-steps">
                <div class="step active"><span class="step-number">1</span><span>Shipping</span></div>
                <div class="step"><span class="step-number">2</span><span>Payment</span></div>
                <div class="step"><span class="step-number">3</span><span>Review</span></div>
            </div>

            <div class="checkout-content">
                <div class="checkout-form">
                    <h2 class="section-title">Shipping Information</h2>
                    <form id="checkoutForm">
                        <div class="form-row">
                            <div class="form-group"><label>First Name *</label><input type="text" required></div>
                            <div class="form-group"><label>Last Name *</label><input type="text" required></div>
                        </div>
                        <div class="form-group"><label>Email Address *</label><input type="email" required></div>
                        <div class="form-group"><label>Phone Number *</label><input type="tel" required></div>
                        <div class="form-group"><label>Address *</label><input type="text" placeholder="Street address" required></div>
                        <div class="form-row">
                            <div class="form-group"><label>City *</label><input type="text" required></div>
                            <div class="form-group"><label>State *</label><input type="text" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Postal Code *</label><input type="text" required></div>
                            <div class="form-group"><label>Country *</label><select required><option>India</option><option>USA</option><option>UK</option></select></div>
                        </div>
                        <div class="form-group"><label>Order Notes (Optional)</label><textarea rows="3" placeholder="Any special instructions..."></textarea></div>

                        <h2 class="section-title" style="margin-top: 40px;">Payment Method</h2>
                        <div class="payment-methods">
                            <label class="payment-option selected">
                                <input type="radio" name="payment" value="cod" checked>
                                <div class="payment-icon"><i class="fas fa-money-bill-wave"></i></div>
                                <div><strong>Cash on Delivery</strong><p style="font-size: 13px; color: #666; margin: 0;">Pay when you receive</p></div>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="card">
                                <div class="payment-icon"><i class="fas fa-credit-card"></i></div>
                                <div><strong>Credit/Debit Card</strong><p style="font-size: 13px; color: #666; margin: 0;">Visa, Mastercard, Amex</p></div>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="upi">
                                <div class="payment-icon"><i class="fas fa-mobile-alt"></i></div>
                                <div><strong>UPI Payment</strong><p style="font-size: 13px; color: #666; margin: 0;">Google Pay, PhonePe, Paytm</p></div>
                            </label>
                            <label class="payment-option">
                                <input type="radio" name="payment" value="bank">
                                <div class="payment-icon"><i class="fas fa-university"></i></div>
                                <div><strong>Net Banking</strong><p style="font-size: 13px; color: #666; margin: 0;">All major banks</p></div>
                            </label>
                        </div>
                    </form>
                </div>

                <div class="order-summary">
                    <h2 style="margin-bottom: 25px;">Order Summary</h2>
                    <div id="orderItems"></div>
                    <div class="summary-item"><span>Subtotal:</span><span id="subtotal">₹0</span></div>
                    <div class="summary-item"><span>Shipping:</span><span>Free</span></div>
                    <div class="summary-item"><span>Tax (5%):</span><span id="tax">₹0</span></div>
                    <div class="summary-item summary-total"><span>Total:</span><span id="total">₹0</span></div>
                    <button class="place-order-btn" onclick="placeOrder()"><i class="fas fa-lock"></i> Place Order Securely</button>
                    <p style="text-align: center; font-size: 12px; color: #666; margin-top: 15px;"><i class="fas fa-shield-alt"></i> Your information is secure and encrypted</p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const tax = Math.round(subtotal * 0.05);
        const total = subtotal + tax;

        document.getElementById('orderItems').innerHTML = cart.map(item => `
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px;">
                <span>${item.name} x ${item.quantity}</span>
                <span>₹${(item.price * item.quantity).toLocaleString()}</span>
            </div>
        `).join('');

        document.getElementById('subtotal').textContent = `₹${subtotal.toLocaleString()}`;
        document.getElementById('tax').textContent = `₹${tax.toLocaleString()}`;
        document.getElementById('total').textContent = `₹${total.toLocaleString()}`;

        document.querySelectorAll('.payment-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                this.querySelector('input').checked = true;
            });
        });

        function placeOrder() {
            const form = document.getElementById('checkoutForm');
            if (form.checkValidity()) {
                const orderId = 'ORD' + Date.now();
                localStorage.setItem('lastOrder', orderId);
                localStorage.setItem('cart', JSON.stringify([]));
                showNotification('Order placed successfully!', 'success');
                setTimeout(() => {
                    window.location.href = `order-tracking.html?id=${orderId}`;
                }, 1500);
            } else {
                form.reportValidity();
            }
        }
    </script>
</body>
</html>
